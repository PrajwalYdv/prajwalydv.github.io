<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Prajwal Yadav | Software Engineer</title>
  <meta name="description" content="Prajwal Yadav – AI & Software Engineer Portfolio" />

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --dark: #020617;
      --muted: #94a3b8;
      --accent: #3b82f6;
      --glass: rgba(255,255,255,0.08);
      --blur: blur(20px);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { scroll-behavior: smooth; }

    body {
      font-family: 'Inter', sans-serif;
      background: radial-gradient(circle at top, #020617, #000);
      color: #e5e7eb;
      overflow-x: hidden;
    }

    .glow {
      position: fixed;
      width: 600px;
      height: 600px;
      background: radial-gradient(circle, rgba(59,130,246,0.35), transparent 60%);
      top: -200px;
      right: -200px;
      filter: blur(120px);
      z-index: -1;
      animation: float 12s ease-in-out infinite;
    }

    @keyframes float {
      0%,100% { transform: translateY(0); }
      50% { transform: translateY(120px); }
    }

    section { padding: 120px 24px; }
    .container { max-width: 1200px; margin: auto; }

    header {
      min-height: 100vh;
      display: flex;
      align-items: center;
    }

    .hero { text-align: center; }

    .profile-img {
      width: 180px;
      height: 180px;
      object-fit: cover;
      border-radius: 50%;
      margin-bottom: 30px;
      border: 2px solid rgba(255,255,255,0.2);
      box-shadow:
        0 0 0 6px rgba(59,130,246,0.12),
        0 30px 80px rgba(0,0,0,0.6);
      transition: transform .6s ease, box-shadow .6s ease;
    }

    .profile-img:hover {
      transform: scale(1.05);
      box-shadow:
        0 0 0 8px rgba(59,130,246,0.25),
        0 40px 120px rgba(59,130,246,0.4);
    }

    h1 {
      font-size: clamp(2.8rem, 6vw, 4.5rem);
      font-weight: 700;
      letter-spacing: -1px;
    }

    h1 span {
      background: linear-gradient(90deg, #60a5fa, #3b82f6);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .hero p {
      margin: 20px auto;
      max-width: 680px;
      font-size: 1.2rem;
      color: var(--muted);
    }

    .social {
      margin-top: 35px;
      display: flex;
      gap: 16px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .social a {
      padding: 12px 26px;
      border-radius: 999px;
      background: rgba(59,130,246,0.15);
      border: 1px solid rgba(59,130,246,0.3);
      color: #bfdbfe;
      text-decoration: none;
      font-size: .9rem;
      transition: all .4s ease;
    }

    .social a:hover {
      background: rgba(59,130,246,0.3);
      transform: translateY(-4px);
      box-shadow: 0 20px 60px rgba(59,130,246,0.4);
    }

    .card {
      background: var(--glass);
      backdrop-filter: var(--blur);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 24px;
      padding: 32px;
    }

    h2 {
      font-size: 2.2rem;
      margin-bottom: 50px;
      text-align: center;
    }

    .pill {
      display: inline-block;
      padding: 8px 16px;
      margin: 6px;
      border-radius: 999px;
      background: rgba(59,130,246,0.15);
      border: 1px solid rgba(59,130,246,0.3);
      font-size: .85rem;
      color: #bfdbfe;
    }

    footer {
      padding: 60px 24px;
      text-align: center;
      color: var(--muted);
    }
  </style>
</head>

<body>

  <div class="glow"></div>

  <!-- HERO -->
  <header>
    <div class="container hero">
      <img src="profile.jpg" alt="Prajwal Yadav" class="profile-img">

      <h1>Prajwal <span>Yadav</span></h1>

      <p>
        Computer Science Engineer specializing in Artificial Intelligence,
        Machine Learning, and modern software development.
      </p>

      <div class="social">
        <a href="https://www.facebook.com/share/1BtzQKxUsY/?mibextid=wwXIfr" target="_blank">Facebook</a>
        <a href="https://www.instagram.com/_prajwal_ydv" target="_blank">Instagram</a>
        <a href="https://www.linkedin.com/in/prajwal-yadav-7048b2257" target="_blank">LinkedIn</a>
      </div>
    </div>
  </header>

  <footer>
    © 2025 Prajwal Yadav · Professional Portfolio
  </footer>

</body>
</html>
